[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app", "error::DeprecationWarning:training"]
